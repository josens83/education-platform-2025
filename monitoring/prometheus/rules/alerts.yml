# Prometheus Alert Rules
# Elite Developer Methodology - Proactive Monitoring

groups:
  - name: api_alerts
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(education_platform_http_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(education_platform_http_requests_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # High response time
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95,
            rate(education_platform_http_request_duration_seconds_bucket[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High API response time"
          description: "95th percentile response time is {{ $value }}s (threshold: 2s)"

      # API endpoint down
      - alert: APIEndpointDown
        expr: |
          up{job="backend-api"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Backend API is down"
          description: "Backend API has been unavailable for more than 1 minute"

  - name: database_alerts
    interval: 30s
    rules:
      # Database connection issues
      - alert: DatabaseConnectionHigh
        expr: |
          pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "High database connections"
          description: "Database has {{ $value }} active connections (threshold: 80)"

      # Slow queries
      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95,
            rate(education_platform_db_query_duration_seconds_bucket[5m])
          ) > 1
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Slow database queries detected"
          description: "95th percentile query time is {{ $value }}s (threshold: 1s)"

      # Database down
      - alert: DatabaseDown
        expr: |
          up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "PostgreSQL database is down"
          description: "Database has been unavailable for more than 1 minute"

  - name: system_alerts
    interval: 30s
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanize }}% (threshold: 80%)"

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanize }}% (threshold: 85%)"

      # Disk space low
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "Low disk space"
          description: "Available disk space is {{ $value | humanize }}% (threshold: 15%)"

      # Disk space critical
      - alert: DiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes) * 100 < 5
        for: 1m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "Critical disk space"
          description: "Available disk space is {{ $value | humanize }}% (threshold: 5%)"

  - name: business_alerts
    interval: 1m
    rules:
      # Payment failures spike
      - alert: HighPaymentFailureRate
        expr: |
          (
            sum(rate(education_platform_payment_transactions_total{status="failed"}[5m]))
            /
            sum(rate(education_platform_payment_transactions_total[5m]))
          ) > 0.1
        for: 5m
        labels:
          severity: critical
          category: business
        annotations:
          summary: "High payment failure rate"
          description: "Payment failure rate is {{ $value | humanizePercentage }} (threshold: 10%)"

      # No user registrations
      - alert: NoUserRegistrations
        expr: |
          rate(education_platform_user_registrations_total[30m]) == 0
        for: 30m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "No user registrations"
          description: "No new user registrations in the last 30 minutes"

      # Login failures spike
      - alert: HighLoginFailureRate
        expr: |
          sum(rate(education_platform_api_errors_total{route="/api/auth/login"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "High login failure rate"
          description: "Login failures: {{ $value }} per second (threshold: 10/s)"

  - name: redis_alerts
    interval: 30s
    rules:
      # Redis down
      - alert: RedisDown
        expr: |
          up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Redis is down"
          description: "Redis has been unavailable for more than 1 minute"

      # High Redis memory
      - alert: RedisMemoryHigh
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          category: cache
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory usage is {{ $value | humanizePercentage }} (threshold: 90%)"

  - name: container_alerts
    interval: 30s
    rules:
      # Container restart
      - alert: ContainerRestarting
        expr: |
          rate(container_last_seen[5m]) > 2
        for: 5m
        labels:
          severity: warning
          category: containers
        annotations:
          summary: "Container restarting frequently"
          description: "Container {{ $labels.name }} is restarting frequently"

      # Container high CPU
      - alert: ContainerHighCPU
        expr: |
          (sum(rate(container_cpu_usage_seconds_total[5m])) by (name) * 100) > 80
        for: 5m
        labels:
          severity: warning
          category: containers
        annotations:
          summary: "Container high CPU usage"
          description: "Container {{ $labels.name }} CPU usage is {{ $value }}%"
