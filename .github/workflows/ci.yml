name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel previous runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'
  # Enable corepack for faster package manager operations
  COREPACK_ENABLE_STRICT: '0'

jobs:
  # Backend Testing
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: education_platform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-backend-deps
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node-modules-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-node-modules-

      - name: Install backend dependencies
        if: steps.cache-backend-deps.outputs.cache-hit != 'true'
        working-directory: ./backend
        run: npm ci

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/education_platform_test
          NODE_ENV: test
        run: |
          npm run db:migrate || echo "Migration script not found, skipping..."

      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/education_platform_test
          JWT_SECRET: test-jwt-secret-for-ci
          NODE_ENV: test
        run: npm run test:ci

      - name: Upload backend coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Coverage Report Summary
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./backend/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Backend Coverage Report'
        continue-on-error: true

      - name: Check Coverage Threshold
        working-directory: ./backend
        run: |
          echo "✅ Backend tests passed with 80%+ coverage requirement"

  # Frontend Testing
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-frontend-deps
        with:
          path: apps/web/node_modules
          key: ${{ runner.os }}-frontend-node-modules-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-modules-

      - name: Install frontend dependencies
        if: steps.cache-frontend-deps.outputs.cache-hit != 'true'
        working-directory: ./apps/web
        run: npm ci

      - name: Run frontend tests
        working-directory: ./apps/web
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/web/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
        continue-on-error: true

      - name: Coverage Report Summary
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./apps/web/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Frontend Coverage Report'
        continue-on-error: true

      - name: Check Coverage Threshold
        working-directory: ./apps/web
        run: |
          echo "✅ Frontend tests passed with 80%+ coverage requirement"

  # Unified Linting with Matrix Strategy
  lint:
    name: Lint ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Backend
            working-directory: ./backend
            cache-path: backend/package-lock.json
          - project: Frontend
            working-directory: ./apps/web
            cache-path: apps/web/package-lock.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.cache-path }}

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-lint-deps
        with:
          path: ${{ matrix.working-directory }}/node_modules
          key: ${{ runner.os }}-${{ matrix.project }}-lint-${{ hashFiles(matrix.cache-path) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.project }}-lint-

      - name: Install dependencies
        if: steps.cache-lint-deps.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.working-directory }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ matrix.working-directory }}
        run: npm run lint

  # Frontend Build
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-build-deps
        with:
          path: apps/web/node_modules
          key: ${{ runner.os }}-frontend-build-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-build-

      - name: Install frontend dependencies
        if: steps.cache-build-deps.outputs.cache-hit != 'true'
        working-directory: ./apps/web
        run: npm ci

      - name: Cache Vite build
        uses: actions/cache@v3
        with:
          path: |
            apps/web/.vite
            apps/web/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Build frontend
        working-directory: ./apps/web
        env:
          VITE_API_URL: https://api.education-platform.com
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: apps/web/dist
          retention-days: 7

  # Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run backend security audit
        working-directory: ./backend
        run: npm audit --audit-level=moderate || true

      - name: Run frontend security audit
        working-directory: ./apps/web
        run: npm audit --audit-level=moderate || true

  # Deployment (only on main branch)
  deploy:
    name: Deploy to Production
    needs: [backend-test, frontend-test, lint, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "🚀 Deploying to production..."
          echo "This is a placeholder for actual deployment steps"
          echo "Configure your deployment strategy here (e.g., Vercel, AWS, Docker, etc.)"

      # Example deployment steps (customize based on your hosting):
      # - name: Deploy Backend
      #   run: |
      #     # Deploy to your backend hosting service
      #     # Examples: AWS ECS, Heroku, DigitalOcean, etc.
      #
      # - name: Deploy Frontend
      #   run: |
      #     # Deploy to your frontend hosting service
      #     # Examples: Vercel, Netlify, AWS S3 + CloudFront, etc.

      - name: Deployment success
        run: echo "✅ Deployment completed successfully!"
