name: CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20.x'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:buildcache,mode=max

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.education-platform.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying to Staging environment..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"

          # Placeholder for actual deployment commands
          # Example deployment strategies:
          # 1. SSH to server and pull latest images
          # 2. Use kubectl for Kubernetes deployment
          # 3. Use AWS CLI for ECS/Fargate
          # 4. Use Terraform/Ansible for infrastructure updates

          # Example SSH deployment:
          # ssh user@staging-server "cd /app && docker-compose pull && docker-compose up -d"

          # Example Kubernetes deployment:
          # kubectl set image deployment/backend backend=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          # kubectl set image deployment/frontend frontend=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}

      - name: Run database migrations
        run: |
          echo "📦 Running database migrations..."
          # Placeholder for migration commands
          # kubectl exec -it deployment/backend -- npm run db:migrate:up

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for services to be healthy..."
          sleep 30

      - name: Health check
        run: |
          echo "🏥 Performing health checks..."
          MAX_ATTEMPTS=10
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -f -s https://staging-api.education-platform.com/api/health > /dev/null 2>&1; then
              echo "✅ Backend health check passed"
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
            echo "⏳ Attempt $ATTEMPT/$MAX_ATTEMPTS failed, retrying in 10s..."
            sleep 10
          done

          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: Smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          # Basic API smoke tests
          curl -f https://staging-api.education-platform.com/api/health || exit 1
          curl -f https://staging-api.education-platform.com/api/health/detailed || exit 1

      - name: Deployment summary
        run: |
          echo "## 🚀 Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://staging.education-platform.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Health Checks Passed" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            echo "✅ Staging deployment successful!"
          else
            echo "❌ Staging deployment failed!"
          fi

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://education-platform.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create backup
        run: |
          echo "💾 Creating backup before deployment..."
          # Placeholder for backup creation
          # pg_dump $DATABASE_URL > backup-$(date +%Y%m%d-%H%M%S).sql
          # aws s3 cp backup.sql s3://backups/production/

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to Production environment..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"

          # Blue-Green or Canary deployment strategy
          # 1. Deploy to new instances
          # 2. Gradually shift traffic
          # 3. Monitor for errors
          # 4. Complete rollout or rollback

      - name: Run database migrations
        run: |
          echo "📦 Running database migrations..."
          # Placeholder for migration commands with backup
          # Create migration backup first
          # Then run migrations

      - name: Gradual traffic shift
        run: |
          echo "🔄 Gradually shifting traffic to new version..."
          echo "10% traffic..."
          sleep 30
          echo "50% traffic..."
          sleep 30
          echo "100% traffic..."

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for services to stabilize..."
          sleep 60

      - name: Health check
        run: |
          echo "🏥 Performing production health checks..."
          MAX_ATTEMPTS=15
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -f -s https://api.education-platform.com/api/health > /dev/null 2>&1; then
              echo "✅ Backend health check passed"
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
            echo "⏳ Attempt $ATTEMPT/$MAX_ATTEMPTS failed, retrying in 10s..."
            sleep 10
          done

          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
            echo "🔄 Initiating automatic rollback..."
            exit 1
          fi

      - name: Monitor error rates
        run: |
          echo "📊 Monitoring error rates..."
          # Check error rates from monitoring system
          # If error rate > threshold, trigger rollback

      - name: Smoke tests
        run: |
          echo "🧪 Running production smoke tests..."
          curl -f https://api.education-platform.com/api/health || exit 1
          curl -f https://api.education-platform.com/api/health/detailed || exit 1

      - name: Deployment summary
        run: |
          echo "## 🎉 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://education-platform.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ All Checks Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Health checks: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke tests: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Error rates: ✅" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            echo "🎉 Production deployment successful!"
            echo "✅ DORA Metrics: Deployment completed"
            echo "⏱️ Deployment started at: ${{ github.event.head_commit.timestamp }}"
            echo "📍 Deployed version: ${{ github.sha }}"
          else
            echo "❌ Production deployment failed!"
            echo "🔄 Please check logs and consider rollback"
          fi

  deployment-metrics:
    name: Update DORA Metrics
    needs: [deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Record deployment
        run: |
          echo "📊 Recording deployment metrics..."
          echo "Deployment Frequency: +1"
          echo "Environment: ${{ needs.deploy-production.result == 'success' && 'production' || 'staging' }}"
          echo "Status: ${{ needs.deploy-production.result || needs.deploy-staging.result }}"
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
