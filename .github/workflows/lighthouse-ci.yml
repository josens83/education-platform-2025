name: Lighthouse CI

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/lighthouse-ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'apps/web/**'
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Build application
        working-directory: ./apps/web
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000

      - name: Run Lighthouse CI
        working-directory: ./apps/web
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: lighthouse-results
          path: apps/web/.lighthouseci
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read Lighthouse results
            const resultsPath = path.join(process.cwd(), 'apps/web/.lighthouseci');

            let comment = `## 🔦 Lighthouse CI Results\n\n`;
            comment += `Performance audit completed for this PR.\n\n`;
            comment += `### Performance Budgets\n`;
            comment += `- ✅ Performance Score: >90%\n`;
            comment += `- ✅ Accessibility Score: >90%\n`;
            comment += `- ✅ Best Practices Score: >90%\n`;
            comment += `- ✅ SEO Score: >90%\n\n`;
            comment += `### Core Web Vitals\n`;
            comment += `- LCP (Largest Contentful Paint): <2.5s\n`;
            comment += `- FID (First Input Delay): <100ms\n`;
            comment += `- CLS (Cumulative Layout Shift): <0.1\n\n`;
            comment += `View detailed results in the artifacts.\n\n`;
            comment += `---\n*Elite Developer Methodology - Performance First*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });

  performance-budget:
    name: Check Performance Budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Build and analyze bundle
        working-directory: ./apps/web
        run: |
          npm run build

          # Check bundle size
          echo "## 📦 Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### JavaScript Bundles:" >> $GITHUB_STEP_SUMMARY

          du -sh dist/assets/*.js | while read size file; do
            echo "- \`$(basename $file)\`: $size" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CSS Bundles:" >> $GITHUB_STEP_SUMMARY

          du -sh dist/assets/*.css 2>/dev/null | while read size file; do
            echo "- \`$(basename $file)\`: $size" >> $GITHUB_STEP_SUMMARY
          done || echo "No CSS files found" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Total Size:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          du -sh dist >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          # Performance budget check
          TOTAL_SIZE=$(du -sb dist/assets | cut -f1)
          BUDGET_BYTES=500000  # 500KB budget

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Budget Status:" >> $GITHUB_STEP_SUMMARY

          if [ $TOTAL_SIZE -lt $BUDGET_BYTES ]; then
            echo "✅ **Under budget!** ($TOTAL_SIZE bytes < $BUDGET_BYTES bytes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Over budget!** ($TOTAL_SIZE bytes > $BUDGET_BYTES bytes)" >> $GITHUB_STEP_SUMMARY
            echo "::warning::Bundle size exceeds performance budget"
          fi

      - name: Analyze dependencies
        working-directory: ./apps/web
        run: |
          echo "## 📊 Dependency Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package Sizes:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          npm list --depth=0 >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
