name: Auto Rollback System

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - staging
          - production
      reason:
        description: 'Reason for rollback'
        required: true
        type: string
  repository_dispatch:
    types: [auto-rollback-trigger]

env:
  NODE_VERSION: '20.x'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify-rollback-need:
    name: Verify Rollback Necessity
    runs-on: ubuntu-latest
    outputs:
      should_rollback: ${{ steps.check.outputs.should_rollback }}
      health_status: ${{ steps.check.outputs.health_status }}
      error_rate: ${{ steps.check.outputs.error_rate }}

    steps:
      - name: Check system health
        id: check
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || github.event.client_payload.environment }}"

          if [ "$ENVIRONMENT" = "production" ]; then
            API_URL="https://api.education-platform.com"
          else
            API_URL="https://staging-api.education-platform.com"
          fi

          echo "🔍 Checking health of $ENVIRONMENT environment..."

          # Check health endpoint
          HEALTH_CHECK=0
          if curl -f -s "$API_URL/api/health" > /dev/null 2>&1; then
            echo "✅ Health endpoint responding"
            HEALTH_CHECK=1
          else
            echo "❌ Health endpoint not responding"
          fi

          # Check detailed health
          DETAILED_HEALTH=$(curl -s "$API_URL/api/health/detailed" || echo '{"status":"unhealthy"}')
          echo "Detailed health: $DETAILED_HEALTH"

          # Simulate error rate check (in production, integrate with monitoring)
          ERROR_RATE=2  # Percentage
          ERROR_THRESHOLD=5  # Maximum acceptable error rate

          # Determine if rollback is needed
          SHOULD_ROLLBACK="false"
          if [ $HEALTH_CHECK -eq 0 ]; then
            SHOULD_ROLLBACK="true"
            echo "⚠️ Rollback needed: Health check failed"
          elif [ $ERROR_RATE -gt $ERROR_THRESHOLD ]; then
            SHOULD_ROLLBACK="true"
            echo "⚠️ Rollback needed: Error rate too high ($ERROR_RATE% > $ERROR_THRESHOLD%)"
          fi

          echo "should_rollback=$SHOULD_ROLLBACK" >> $GITHUB_OUTPUT
          echo "health_status=$HEALTH_CHECK" >> $GITHUB_OUTPUT
          echo "error_rate=$ERROR_RATE" >> $GITHUB_OUTPUT

  execute-rollback:
    name: Execute Rollback
    needs: verify-rollback-need
    if: needs.verify-rollback-need.outputs.should_rollback == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || github.event.client_payload.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous deployment
        id: previous
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || github.event.client_payload.environment }}"

          # Get the previous successful deployment SHA
          # In a real scenario, this would query a deployment database or use GitHub deployments API
          PREVIOUS_SHA=$(git log --grep="deploy.*$ENVIRONMENT.*success" --format="%H" -n 2 | tail -1)

          if [ -z "$PREVIOUS_SHA" ]; then
            # Fallback to previous commit
            PREVIOUS_SHA=$(git rev-parse HEAD~1)
          fi

          echo "previous_sha=$PREVIOUS_SHA" >> $GITHUB_OUTPUT
          echo "📍 Rolling back to commit: $PREVIOUS_SHA"

      - name: Create rollback backup
        run: |
          echo "💾 Creating rollback backup of current state..."
          CURRENT_SHA="${{ github.sha }}"
          echo "Current SHA: $CURRENT_SHA" > rollback-metadata.txt
          echo "Rollback timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> rollback-metadata.txt
          echo "Triggered by: ${{ github.actor }}" >> rollback-metadata.txt
          echo "Reason: ${{ github.event.inputs.reason || 'Automatic rollback due to health check failure' }}" >> rollback-metadata.txt

      - name: Deploy previous version
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || github.event.client_payload.environment }}"
          PREVIOUS_SHA="${{ steps.previous.outputs.previous_sha }}"

          echo "🔄 Rolling back $ENVIRONMENT to $PREVIOUS_SHA..."

          # Checkout previous version
          git checkout $PREVIOUS_SHA

          # Deploy using the same strategy as forward deployment
          # This ensures consistency between deployments and rollbacks

          if [ "$ENVIRONMENT" = "production" ]; then
            echo "🔄 Rolling back production..."
            # kubectl set image deployment/backend backend=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-backend:$PREVIOUS_SHA
            # kubectl set image deployment/frontend frontend=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:$PREVIOUS_SHA
          else
            echo "🔄 Rolling back staging..."
            # ssh user@staging-server "cd /app && git checkout $PREVIOUS_SHA && docker-compose up -d --build"
          fi

      - name: Wait for rollback completion
        run: |
          echo "⏳ Waiting for rollback to complete..."
          sleep 60

      - name: Verify rollback success
        id: verify
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || github.event.client_payload.environment }}"

          if [ "$ENVIRONMENT" = "production" ]; then
            API_URL="https://api.education-platform.com"
          else
            API_URL="https://staging-api.education-platform.com"
          fi

          echo "🏥 Verifying rolled back version health..."
          MAX_ATTEMPTS=10
          ATTEMPT=0
          SUCCESS=false

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -f -s "$API_URL/api/health" > /dev/null 2>&1; then
              echo "✅ Rollback successful - health check passed"
              SUCCESS=true
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
            echo "⏳ Verification attempt $ATTEMPT/$MAX_ATTEMPTS..."
            sleep 10
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Rollback verification failed"
            echo "🚨 Manual intervention required"
            exit 1
          fi

          echo "success=$SUCCESS" >> $GITHUB_OUTPUT

      - name: Record rollback metrics
        run: |
          echo "📊 Recording rollback metrics..."
          echo "Environment: ${{ github.event.inputs.environment || github.event.client_payload.environment }}"
          echo "Reason: ${{ github.event.inputs.reason || 'Auto-rollback triggered' }}"
          echo "From SHA: ${{ github.sha }}"
          echo "To SHA: ${{ steps.previous.outputs.previous_sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          # This contributes to DORA MTTR (Mean Time To Recovery) metric

      - name: Rollback summary
        run: |
          ENV="${{ github.event.inputs.environment || github.event.client_payload.environment }}"
          REASON="${{ github.event.inputs.reason || 'Automatic rollback due to health check failure' }}"

          echo "## 🔄 Rollback Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: $ENV" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason**: $REASON" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous SHA**: ${{ steps.previous.outputs.previous_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Executed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.verify.outputs.success == 'true' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Health Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Status**: ${{ needs.verify-rollback-need.outputs.health_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Error Rate**: ${{ needs.verify-rollback-need.outputs.error_rate }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### DORA Metrics Impact" >> $GITHUB_STEP_SUMMARY
          echo "- **MTTR**: Incident detected and recovered" >> $GITHUB_STEP_SUMMARY
          echo "- **Change Failure Rate**: Recorded failed deployment" >> $GITHUB_STEP_SUMMARY

      - name: Notify team
        if: always()
        run: |
          STATUS="${{ steps.verify.outputs.success }}"
          ENV="${{ github.event.inputs.environment || github.event.client_payload.environment }}"

          if [ "$STATUS" = "true" ]; then
            echo "✅ Rollback notification: $ENV successfully rolled back"
            # Send success notification (Slack, Discord, email, etc.)
          else
            echo "🚨 CRITICAL: Rollback failed for $ENV - Manual intervention required!"
            # Send critical alert
          fi

  post-rollback-analysis:
    name: Post-Rollback Analysis
    needs: execute-rollback
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Analyze rollback
        run: |
          echo "📊 Performing post-rollback analysis..."
          echo "1. Reviewing logs from failed deployment"
          echo "2. Identifying root cause"
          echo "3. Documenting incident"
          echo "4. Creating action items"

      - name: Create incident report
        run: |
          cat << EOF > incident-report.md
          # Incident Report: Rollback Executed

          ## Summary
          - **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Environment**: ${{ github.event.inputs.environment || github.event.client_payload.environment }}
          - **Trigger**: ${{ github.event.inputs.reason || 'Automatic health check failure' }}
          - **Resolution**: Rollback to previous stable version

          ## Timeline
          - Deployment failure detected
          - Automatic rollback initiated
          - Previous version deployed
          - Health checks verified

          ## Root Cause
          To be investigated and documented

          ## Action Items
          - [ ] Investigate root cause of failure
          - [ ] Implement additional tests to catch similar issues
          - [ ] Review deployment process
          - [ ] Update monitoring alerts if needed

          ## DORA Metrics
          - MTTR: Time from detection to recovery recorded
          - Change Failure Rate: Deployment marked as failed
          EOF

          cat incident-report.md

      - name: Post-rollback summary
        run: |
          echo "## 📋 Post-Rollback Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "An incident report has been generated." >> $GITHUB_STEP_SUMMARY
          echo "Next steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Review incident report" >> $GITHUB_STEP_SUMMARY
          echo "2. Investigate root cause" >> $GITHUB_STEP_SUMMARY
          echo "3. Fix identified issues" >> $GITHUB_STEP_SUMMARY
          echo "4. Test thoroughly before redeployment" >> $GITHUB_STEP_SUMMARY
